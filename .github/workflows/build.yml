name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "فایل زیپ پیدا نشد"; exit 1; fi
          
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          
          PUBSPEC=$(find extracted -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then echo "pubspec.yaml پیدا نشد"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean and Rebuild Android Folder
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          rm -rf android
          mkdir -p /tmp/my_code
          cp -r lib assets pubspec.yaml /tmp/my_code/ 2>/dev/null || true
          flutter create --org com.example --project-name not_app --platforms=android .
          cp -rf /tmp/my_code/* .

      # 🌟 حذف هوشمندانه share_plus و اصلاح خودکار کدهای دارت
      - name: Fix Share errors
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          # ۱. حذف پکیج از pubspec.yaml
          sed -i '/share_plus:/d' pubspec.yaml
          
          # ۲. پردازش فایل‌های دارت
          find lib -name "*.dart" | while read -r file; do
            # حذف خط ایمپورت
            sed -i "/import 'package:share_plus/d" "$file"
            
            # پیدا کردن خطی که Share.share دارد
            if grep -q "Share.share" "$file"; then
              # پیدا کردن شماره خطی که Share.share در آن است
              LINE_NUM=$(grep -n "Share.share" "$file" | cut -d: -f1 | head -n 1)
              
              if [ -n "$LINE_NUM" ]; then
                # چون دستور Share در یک خط بوده، ما ۲ خط بالا و ۲ خط پایین آن را حذف می‌کنیم
                # تا کل ویجت IconButton سالم پاک شود
                START=$((LINE_NUM - 3))
                END=$((LINE_NUM + 3))
                sed -i "${START},${END}d" "$file"
              fi
            fi
          done

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: not-app-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
