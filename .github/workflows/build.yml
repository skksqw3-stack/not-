name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "فایل زیپ پیدا نشد"; exit 1; fi
          
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          
          PUBSPEC=$(find extracted -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then echo "pubspec.yaml پیدا نشد"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean and Rebuild Android Folder
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          # ۱. پاک کردن کامل پوشه اندروید خرابِ داخل زیپ
          rm -rf android
          
          # ۲. ذخیره کدهای دارت شما در یک پوشه موقت
          mkdir -p /tmp/my_code
          cp -r lib assets pubspec.yaml /tmp/my_code/ 2>/dev/null || true
          
          # ۳. ساخت پروژه کاملاً جدید و سالم
          flutter create --org com.example --project-name not_app --platforms=android .
          
          # ۴. برگرداندن کدهای دارت خودتان به پروژه جدید
          cp -rf /tmp/my_code/* .

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        # دستور بایپس کردن چک نسخه گریدل
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: not-app-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
