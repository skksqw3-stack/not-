name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "فایل زیپ پیدا نشد"; exit 1; fi
          
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          
          PUBSPEC=$(find extracted -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then echo "pubspec.yaml پیدا نشد"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rebuild Android Folder (The Fix)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          # ۱. نگه داشتن فایل‌های خودمان (کدهای دارت)
          rm -rf /tmp/src && mkdir /tmp/src
          cp -r . /tmp/src/
          
          # ۲. پاک کردن کامل پوشه اندروید خرابِ ساخته شده توسط هوش مصنوعی
          rm -rf android
          
          # ۳. ساخت یک پوشه اندروید کاملاً نو و استاندارد
          flutter create --org com.example --project-name not_app --platforms=android .
          
          # ۴. برگرداندن فایل‌های خودمان (مثل lib و assets و pubspec)
          cp -rf /tmp/src/. .

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: not-app-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
