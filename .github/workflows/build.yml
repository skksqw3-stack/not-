name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          # 🌟 نام فایل زیپ جدید شما
          ZIP_FILE="not_app_podcasts_white_screen_fixed.zip"
          
          if [ ! -f "$ZIP_FILE" ]; then 
            echo "فایل پیدا نشد: $ZIP_FILE"; ls -la; exit 1
          fi
          
          echo "✅ در حال باز کردن فایل: $ZIP_FILE"
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          
          PUBSPEC=$(find extracted -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then echo "pubspec.yaml پیدا نشد"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean and Rebuild Android Folder
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          rm -rf android
          mkdir -p /tmp/my_code
          cp -r lib assets pubspec.yaml /tmp/my_code/ 2>/dev/null || true
          flutter create --org com.example --project-name not_app --platforms=android .
          cp -rf /tmp/my_code/* .

      # ارتقای SDK به 34 (برای رفع مشکل Gradle)
      - name: Force Android SDK to 34
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          FILE="android/app/build.gradle"
          if [ -f "$FILE" ]; then
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' "$FILE"
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' "$FILE"
            sed -i 's/compileSdk .*/compileSdk 34/g' "$FILE"
            sed -i 's/targetSdk .*/targetSdk 34/g' "$FILE"
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: not-app-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
