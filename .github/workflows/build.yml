# مسیر فایل در ریپو:  .github/workflows/build-apk.yml
# کار این workflow:
#   ۱) not_app.zip را از ریشهٔ ریپو استخراج می‌کند
#   ۲) فایل‌های ناقص (gradlew و ios) را با flutter create می‌سازد و فایل‌های خودمان را برمی‌گرداند
#   ۳) APK می‌سازد و به‌صورت Artifact آپلود می‌کند
 
name: Build APK
 
on:
  push:
    branches: [main, master]
  workflow_dispatch:   # اجرای دستی از تب Actions
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Extract not_app.zip
        run: |
          set -e
          if [ ! -f not_app.zip ]; then
            echo "not_app.zip در ریشهٔ ریپو پیدا نشد"; ls -la; exit 1
          fi
          mkdir -p extracted
          unzip -q -o not_app.zip -d extracted
          PUBSPEC=$(find extracted -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then echo "pubspec.yaml داخل zip نیست"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"
 
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
 
      - name: Complete project scaffold (gradlew, ios, ...)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          # نسخهٔ پشتیبان از فایل‌های خودمان
          rm -rf /tmp/src && mkdir /tmp/src
          cp -r . /tmp/src/
          flutter create --org com.example --project-name not_app --platforms=android .
          # بازگرداندن فایل‌های خودمان روی خروجی flutter create
          cp -rf /tmp/src/. .
 
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get
 
      - name: Run tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test
 
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release
 
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: not-app-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
