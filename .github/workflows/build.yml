name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then echo "فایل زیپ پیدا نشد"; exit 1; fi
          
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          
          PUBSPEC=$(find extracted -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then echo "pubspec.yaml پیدا نشد"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clean and Rebuild Android Folder
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          rm -rf android
          mkdir -p /tmp/my_code
          cp -r lib assets pubspec.yaml /tmp/my_code/ 2>/dev/null || true
          flutter create --org com.example --project-name not_app --platforms=android .
          cp -rf /tmp/my_code/* .

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      # 🌟 اصلاح مرحله آپدیت SDK به روش مطمئن (پیدا کردن همه فایل‌های build.gradle)
      - name: Update Android SDK to 34
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # پیدا کردن همه فایل‌های build.gradle و اصلاح آن‌ها
          find . -name "build.gradle" | while read -r file; do
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' "$file"
            sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' "$file"
            sed -i 's/compileSdk .*/compileSdk 34/g' "$file"
            sed -i 's/targetSdk .*/targetSdk 34/g' "$file"
          done

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: not-app-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
