name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zip File
        run: |
          set -e
          # پیدا کردن هر فایل زیپی در ریشه پروژه
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then 
            echo "هیچ فایل زیپی پیدا نشد!"; ls -la; exit 1
          fi
          
          echo "در حال باز کردن فایل: $ZIP_FILE"
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted
          
          PUBSPEC=$(find extracted -name pubspec.yaml -not -path "*/.*" | head -n 1)
          if [ -z "$PUBSPEC" ]; then echo "pubspec.yaml داخل zip نیست"; exit 1; fi
          
          echo "PROJECT_DIR=$(dirname "$PUBSPEC")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Complete project scaffold (fix missing files)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          rm -rf /tmp/src && mkdir /tmp/src
          cp -r . /tmp/src/
          # حذف پوشه اندروید قدیمی برای جلوگیری از تداخل نسخه‌ها
          rm -rf android
          # ساخت پوشه اندروید استاندارد و جدید
          flutter create --org com.example --project-name not_app --platforms=android .
          # بازگرداندن کدهای اصلی شما
          cp -rf /tmp/src/. .

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        # دستور معجزه‌آسا برای نادیده گرفتن خطای نسخه گریدل
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: not-app-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
